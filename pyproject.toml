[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "uni-cute-tensor"
version = "1.2.0"
description = "CuTe layout algebra for Host AVX-512 + Xeon Phi + NEC VE heterogeneous systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "mobius" }]
keywords = ["cute", "layout", "tensor", "xeon-phi", "nec-ve", "avx512", "heterogeneous"]
dependencies = [
    "tensor-layouts>=0.3.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Hardware extras are mostly documentation markers: runtimes live on the machine
# (ncc/libveo/icc). Listed deps are Python-side only.
aveo = []
phi = []
viz = ["matplotlib>=3.5"]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "matplotlib>=3.5", "ruff>=0.4"]
all = ["matplotlib>=3.5", "pytest>=7.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/mobius/uni-tensor-layout"
Documentation = "https://github.com/mobius/uni-tensor-layout/blob/main/docs/INDEX.md"
Repository = "https://github.com/mobius/uni-tensor-layout"

[project.scripts]
uct-check-hw = "uni_cute_tensor.cli:check_hw_main"
uct-demo-partition = "uni_cute_tensor.cli:demo_partition_main"
uct-recommend = "uni_cute_tensor.cli:recommend_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uni_cute_tensor = [
    "kernels/host/*.c",
    "kernels/phi/*.c",
    "kernels/ve/*.c",
    "config/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "device: tests that need Phi/VE hardware",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
